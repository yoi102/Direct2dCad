name: Windows desktop regression
on:
  workflow_dispatch:
jobs:
  desktop:
    runs-on: [self-hosted, Windows, X64, interactive-desktop]
    env:
      ContinuousIntegrationBuild: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - name: Native and UI regression on dedicated unlocked desktop
        shell: pwsh
        run: ./scripts/testing/Run-Regression.ps1 -IncludeWindowsIntegration -IncludeUiAutomation -ResultsDirectory TestResults/desktop-ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-desktop-results
          path: TestResults/desktop-ci
