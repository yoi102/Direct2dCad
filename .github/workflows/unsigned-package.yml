name: Unsigned review package
on:
  workflow_dispatch:
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - name: Build unsigned local package
        shell: pwsh
        run: ./scripts/delivery/Build-LocalPackage.ps1 -OutputDirectory TestResults/review-package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Direct2dCad-0.1.3-win-x64-review
          path: TestResults/review-package.zip
